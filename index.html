<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Full Player</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
  :root {
    --acento: #8b5cf6;
    --acento-2: #22b8f0;
    --texto: #ffffff;
    --tenue: rgba(255, 255, 255, 0.62);
    --fondo: #121016;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--fondo); color: var(--texto);
    font-family: 'Montserrat', 'Roboto', 'Noto Sans', sans-serif;
  }
  audio { display: none; }

  /* Fondo: la carátula ampliada y desenfocada */
  #fondo {
    position: fixed; inset: -80px;
    background: center / cover no-repeat;
    filter: blur(50px) brightness(0.42) saturate(1.2);
    transform: scale(1.1);
    transition: background-image 0.8s ease;
  }
  #velo {
    position: fixed; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.6) 100%),
                linear-gradient(0deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 45%);
  }

  /* Pantalla de espera */
  #espera {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    background: radial-gradient(circle at 30% 30%, rgba(139,92,246,0.35), transparent 55%),
                radial-gradient(circle at 70% 70%, rgba(34,184,240,0.28), transparent 55%), var(--fondo);
    transition: opacity 0.6s ease;
  }
  #espera img { width: 180px; height: 180px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); }
  #espera h1 { font-size: 64px; font-weight: 700; letter-spacing: 1px; }
  #espera p { font-size: 26px; color: var(--tenue); }
  body.con-musica #espera { opacity: 0; pointer-events: none; }

  /* Reproductor */
  #reproductor {
    position: fixed; inset: 0;
    padding: 80px 110px 70px;
    display: grid; grid-template-columns: 520px 1fr; column-gap: 80px;
    align-items: center;
    opacity: 0; transition: opacity 0.6s ease;
  }
  body.con-musica #reproductor { opacity: 1; }
  #caratula {
    width: 520px; height: 520px; border-radius: 22px;
    background: rgba(255,255,255,0.06) center / cover no-repeat;
    box-shadow: 0 40px 90px rgba(0,0,0,0.6);
    transition: background-image 0.6s ease;
  }
  #datos { min-width: 0; }
  #posicion { font-size: 24px; color: var(--tenue); font-weight: 500; margin-bottom: 18px; }
  #titulo {
    font-size: 68px; font-weight: 700; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #artista { font-size: 36px; font-weight: 500; margin-top: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #album { font-size: 28px; color: var(--tenue); margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Progreso */
  #progreso { margin-top: 48px; }
  #barra {
    position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.22);
    outline: none; transition: height 0.2s ease;
  }
  #relleno {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px;
    background: linear-gradient(90deg, var(--acento), var(--acento-2));
  }
  #punto {
    position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,0.4);
    left: 0; transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  #barra.enfocado { height: 14px; }
  #barra.enfocado #punto { transform: scale(1.3); box-shadow: 0 0 0 10px rgba(139,92,246,0.45); }
  #tiempos { display: flex; justify-content: space-between; font-size: 22px; color: var(--tenue); margin-top: 14px; }
  #ayuda-barra { font-size: 18px; color: var(--tenue); margin-top: 6px; height: 22px; opacity: 0; transition: opacity 0.2s; }
  #barra.enfocado ~ #ayuda-barra { opacity: 1; }

  /* Controles */
  #controles {
    display: flex; align-items: center; gap: 22px; margin-top: 36px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  body.ambiente #controles { opacity: 0; transform: translateY(20px); }
  .boton {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.1); border: 3px solid transparent;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .boton svg { width: 40px; height: 40px; fill: #fff; }
  .boton.grande { width: 112px; height: 112px; background: linear-gradient(135deg, var(--acento), var(--acento-2)); }
  .boton.grande svg { width: 54px; height: 54px; }
  .boton.enfocado { transform: scale(1.14); border-color: #fff; background: rgba(255,255,255,0.22); }
  .boton.grande.enfocado { background: linear-gradient(135deg, var(--acento), var(--acento-2)); box-shadow: 0 0 0 8px rgba(139,92,246,0.35); }
  .separador { width: 2px; height: 56px; background: rgba(255,255,255,0.18); margin: 0 12px; }
  #volumen { display: flex; align-items: center; gap: 16px; }
  #nivel { width: 180px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22); position: relative; overflow: hidden; }
  #nivel-relleno { position: absolute; inset: 0 auto 0 0; width: 50%; background: #fff; border-radius: 4px; transition: width 0.2s; }
  #nivel-texto { font-size: 22px; color: var(--tenue); width: 70px; }
  body.silencio #nivel-relleno { background: rgba(255,255,255,0.35); }

  /* Aviso breve (volumen, adelantar) */
  #aviso {
    position: fixed; top: 60px; right: 90px;
    padding: 16px 28px; border-radius: 40px; font-size: 26px; font-weight: 600;
    background: rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s ease;
  }
  #aviso.visible { opacity: 1; }
  #marca { position: fixed; bottom: 36px; right: 60px; display: flex; align-items: center; gap: 12px; font-size: 20px; color: var(--tenue); }
  #marca img { width: 36px; height: 36px; }
</style>
</head>
<body>
  <audio id="medio"></audio>
  <div id="fondo"></div>
  <div id="velo"></div>

  <div id="espera">
    <img src="icono.png" alt="">
    <h1>Full Player</h1>
    <p>Esperando música desde el teléfono…</p>
  </div>

  <div id="reproductor">
    <div id="caratula"></div>
    <div id="datos">
      <div id="posicion"></div>
      <div id="titulo"></div>
      <div id="artista"></div>
      <div id="album"></div>

      <div id="progreso">
        <div id="barra"><div id="relleno"></div><div id="punto"></div></div>
        <div id="tiempos"><span id="actual">0:00</span><span id="total">0:00</span></div>
        <div id="ayuda-barra">◀ ▶ para retroceder o adelantar 10 segundos</div>
      </div>

      <div id="controles">
        <div class="boton" id="b-anterior" data-accion="anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </div>
        <div class="boton grande" id="b-play" data-accion="play">
          <svg viewBox="0 0 24 24" id="icono-play"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="boton" id="b-siguiente" data-accion="siguiente">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </div>
        <div class="separador"></div>
        <div id="volumen">
          <div class="boton" id="b-bajar" data-accion="bajar">
            <svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05A4.5 4.5 0 0 0 18.5 12zM5 9v6h4l5 5V4L9 9H5z"/></svg>
          </div>
          <div id="nivel"><div id="nivel-relleno"></div></div>
          <div id="nivel-texto">50%</div>
          <div class="boton" id="b-subir" data-accion="subir">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </div>
          <div class="boton" id="b-silencio" data-accion="silencio">
            <svg viewBox="0 0 24 24" id="icono-silencio"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="aviso"></div>
  <div id="marca"><img src="icono.png" alt="">Full Player</div>

<script>
'use strict';
// ------------------------------------------------------------
// Full Player · receptor para TV (Google Cast, CAF v3)
// Muestra la canción que manda el teléfono y permite controlarla
// con el control remoto: flechas para moverse, OK para elegir.
// ------------------------------------------------------------
const contexto = cast.framework.CastReceiverContext.getInstance();
const reproductor = contexto.getPlayerManager();
const Mensajes = cast.framework.messages;
const $ = (id) => document.getElementById(id);

reproductor.setMediaElement($('medio'));

// ---------- Datos de la canción ----------
function textoDe(meta, ...claves) {
  for (const c of claves) if (meta && meta[c]) return meta[c];
  return '';
}

function mostrarCancion() {
  const info = reproductor.getMediaInformation();
  if (!info) return;
  document.body.classList.add('con-musica');
  const meta = info.metadata || {};
  $('titulo').textContent = textoDe(meta, 'title') || 'Sin título';
  $('artista').textContent = textoDe(meta, 'artist', 'albumArtist', 'subtitle', 'studio');
  $('album').textContent = textoDe(meta, 'albumName');
  const imagen = meta.images && meta.images.length ? meta.images[0].url : '';
  const css = imagen ? `url("${imagen}")` : 'none';
  $('caratula').style.backgroundImage = css;
  $('fondo').style.backgroundImage = css;
  mostrarPosicion();
}

function mostrarPosicion() {
  const cola = reproductor.getQueueManager();
  const items = cola ? cola.getItems() : null;
  const actual = cola ? cola.getCurrentItemIndex() : -1;
  $('posicion').textContent = items && items.length > 1 && actual >= 0 ? `${actual + 1} de ${items.length}` : '';
}

// ---------- Tiempo y estado ----------
function formatear(seg) {
  if (!isFinite(seg) || seg < 0) seg = 0;
  const m = Math.floor(seg / 60), s = Math.floor(seg % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function mostrarProgreso() {
  const total = reproductor.getDurationSec();
  const actual = reproductor.getCurrentTimeSec();
  const fraccion = total > 0 ? Math.min(1, actual / total) : 0;
  $('relleno').style.width = `${fraccion * 100}%`;
  $('punto').style.left = `${fraccion * 100}%`;
  $('actual').textContent = formatear(actual);
  $('total').textContent = formatear(total);
}

function mostrarEstado() {
  const sonando = reproductor.getPlayerState() === Mensajes.PlayerState.PLAYING;
  $('icono-play').innerHTML = sonando
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  programarAmbiente();
}

const Eventos = cast.framework.events.EventType;
reproductor.addEventListener(Eventos.PLAYER_LOAD_COMPLETE, () => { mostrarCancion(); mostrarEstado(); });
reproductor.addEventListener(Eventos.MEDIA_STATUS, () => { mostrarCancion(); mostrarEstado(); });
reproductor.addEventListener([Eventos.PLAYING, Eventos.PAUSE, Eventos.BUFFERING, Eventos.ENDED], mostrarEstado);
setInterval(mostrarProgreso, 500);

// ---------- Acciones ----------
function pasarA(salto) {
  const pedido = new Mensajes.QueueUpdateRequestData();
  pedido.type = Mensajes.MessageType.QUEUE_UPDATE;
  pedido.jump = salto;
  reproductor.sendLocalMediaRequest(pedido);
}

function adelantar(segundos) {
  const total = reproductor.getDurationSec();
  let destino = reproductor.getCurrentTimeSec() + segundos;
  destino = Math.max(0, total > 0 ? Math.min(destino, total - 1) : destino);
  reproductor.seek(destino);
  avisar(segundos > 0 ? `+${segundos} s` : `−${-segundos} s`);
  mostrarProgreso();
}

function cambiarVolumen(paso) {
  const v = contexto.getSystemVolume();
  if (!v) return;
  const nivel = Math.max(0, Math.min(1, Math.round((v.level + paso) * 20) / 20));
  contexto.setSystemVolumeLevel(nivel);
  if (v.muted && paso > 0) contexto.setSystemVolumeMuted(false);
  avisar(`Volumen ${Math.round(nivel * 100)}%`);
}

const acciones = {
  anterior() {
    // como en el teléfono: si ya avanzó unos segundos, vuelve al principio de la canción
    if (reproductor.getCurrentTimeSec() > 3) reproductor.seek(0);
    else pasarA(-1);
  },
  play() {
    if (reproductor.getPlayerState() === Mensajes.PlayerState.PLAYING) reproductor.pause();
    else reproductor.play();
  },
  siguiente() { pasarA(1); },
  bajar() { cambiarVolumen(-0.05); },
  subir() { cambiarVolumen(0.05); },
  silencio() {
    const v = contexto.getSystemVolume();
    if (v) contexto.setSystemVolumeMuted(!v.muted);
  },
};

// ---------- Volumen del dispositivo ----------
function mostrarVolumen() {
  const v = contexto.getSystemVolume();
  if (!v) return;
  $('nivel-relleno').style.width = `${Math.round(v.level * 100)}%`;
  $('nivel-texto').textContent = v.muted ? 'Mudo' : `${Math.round(v.level * 100)}%`;
  document.body.classList.toggle('silencio', !!v.muted);
}
contexto.addEventListener(cast.framework.system.EventType.SYSTEM_VOLUME_CHANGED, mostrarVolumen);

// ---------- Navegación con el control remoto ----------
const botones = ['b-anterior', 'b-play', 'b-siguiente', 'b-bajar', 'b-subir', 'b-silencio'].map($);
let foco = 1;            // empieza en reproducir / pausar
let enBarra = false;     // la barra de progreso tiene el foco

function pintarFoco() {
  botones.forEach((b, i) => b.classList.toggle('enfocado', !enBarra && i === foco));
  $('barra').classList.toggle('enfocado', enBarra);
}

let temporizador = null;
function programarAmbiente() {
  // si nadie toca el control por un rato mientras suena, se ocultan los botones
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    if (reproductor.getPlayerState() === Mensajes.PlayerState.PLAYING) document.body.classList.add('ambiente');
  }, 10000);
}

let avisoTemp = null;
function avisar(texto) {
  const a = $('aviso');
  a.textContent = texto;
  a.classList.add('visible');
  clearTimeout(avisoTemp);
  avisoTemp = setTimeout(() => a.classList.remove('visible'), 1400);
}

document.addEventListener('keydown', (e) => {
  const despertando = document.body.classList.contains('ambiente');
  document.body.classList.remove('ambiente');
  programarAmbiente();

  // teclas multimedia del control: funcionan siempre
  switch (e.key) {
    case 'MediaPlayPause': case 'MediaPlay': case 'MediaPause': acciones.play(); e.preventDefault(); return;
    case 'MediaTrackNext': acciones.siguiente(); e.preventDefault(); return;
    case 'MediaTrackPrevious': acciones.anterior(); e.preventDefault(); return;
    case 'MediaFastForward': adelantar(10); e.preventDefault(); return;
    case 'MediaRewind': adelantar(-10); e.preventDefault(); return;
  }
  // la primera pulsación solo vuelve a mostrar los controles
  if (despertando) { e.preventDefault(); return; }

  switch (e.key) {
    case 'ArrowLeft':
      if (enBarra) adelantar(-10); else foco = Math.max(0, foco - 1);
      break;
    case 'ArrowRight':
      if (enBarra) adelantar(10); else foco = Math.min(botones.length - 1, foco + 1);
      break;
    case 'ArrowUp':
      enBarra = true;
      break;
    case 'ArrowDown':
      enBarra = false;
      break;
    case 'Enter': case ' ':
      if (enBarra) acciones.play();
      else acciones[botones[foco].dataset.accion]();
      break;
    default:
      return;
  }
  e.preventDefault();
  pintarFoco();
});

// ---------- Arranque ----------
const opciones = new cast.framework.CastReceiverOptions();
opciones.supportedCommands =
  Mensajes.Command.ALL_BASIC_MEDIA | Mensajes.Command.QUEUE_NEXT | Mensajes.Command.QUEUE_PREV;
contexto.start(opciones);
pintarFoco();
mostrarVolumen();
</script>
</body>
</html>
